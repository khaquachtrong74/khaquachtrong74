<svg width="520" height="120" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: "JetBrains Mono", monospace;
      fill: #c9d1d9;
    }

    .small {
      font-size: 13px;
      fill: #8b949e;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .artist {
      font-size: 14px;
    }

    .wave {
      fill: #58a6ff;
    }

    .bar {
      fill: #30363d;
    }

    .progress {
      fill: #58a6ff;
    }
  </style>

  <rect width="520" height="120" rx="12" fill="#0d1117"/>

  <text x="24" y="30" class="small">♪ NOW PLAYING</text>

  <text x="24" y="58" class="title">Resonance</text>
  <text x="24" y="78" class="artist">HOME</text>

  <!-- Equalizer -->

  <rect class="wave" x="300" y="70" width="6" height="24">
    <animate attributeName="height" values="18;40;22;35;18" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="76;54;72;59;76" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <rect class="wave" x="312" y="70" width="6" height="24">
    <animate attributeName="height" values="40;18;34;16;40" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="54;76;60;78;54" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <rect class="wave" x="324" y="70" width="6" height="24">
    <animate attributeName="height" values="20;36;18;42;20" dur="0.75s" repeatCount="indefinite"/>
    <animate attributeName="y" values="74;58;76;52;74" dur="0.75s" repeatCount="indefinite"/>
  </rect>

  <rect class="wave" x="336" y="70" width="6" height="24">
    <animate attributeName="height" values="34;16;40;20;34" dur="0.95s" repeatCount="indefinite"/>
    <animate attributeName="y" values="60;78;54;74;60" dur="0.95s" repeatCount="indefinite"/>
  </rect>

  <rect class="wave" x="348" y="70" width="6" height="24">
    <animate attributeName="height" values="24;42;18;36;24" dur="0.82s" repeatCount="indefinite"/>
    <animate attributeName="y" values="70;52;76;58;70" dur="0.82s" repeatCount="indefinite"/>
  </rect>

  <!-- Progress -->

  <rect class="bar" x="24" y="98" width="472" height="4" rx="2"/>

  <rect class="progress" x="24" y="98" width="0" height="4" rx="2">
    <animate attributeName="width"
             values="0;472;0"
             dur="8s"
             repeatCount="indefinite"/>
  </rect>

  <circle cx="24" cy="100" r="6" fill="#58a6ff">
    <animate attributeName="cx"
             values="24;496;24"
             dur="8s"
             repeatCount="indefinite"/>
  </circle>

</svg>
