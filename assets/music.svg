<svg width="520" height="130" viewBox="0 0 520 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24333b" />
      <stop offset="100%" stop-color="#0d1316" />
    </linearGradient>

    <linearGradient id="albumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a8a96" />
      <stop offset="50%" stop-color="#1c282e" />
      <stop offset="100%" stop-color="#11181b" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55c1cc" />
      <stop offset="100%" stop-color="#9fb4b8" />
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: "JetBrains Mono", "Segoe UI", -apple-system, sans-serif;
    }

    .small {
      font-size: 11px;
      fill: #607980;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      fill: #dae6ea;
      /* Glow xám bạc/xanh nhẹ giống sương mờ */
      text-shadow: 0px 0px 10px rgba(218, 230, 234, 0.3);
    }

    .artist {
      font-size: 14px;
      fill: #7d9ba1;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .bar {
      fill: #1a252a;
    }
  </style>

  <rect width="520" height="130" rx="14" fill="url(#bgGrad)" stroke="#2b3f47" stroke-width="1"/>

  <g transform="translate(20, 20)">
    <rect width="70" height="70" rx="8" fill="url(#albumGrad)" />
    <circle cx="35" cy="35" r="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="35" cy="35" r="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="35" cy="35" r="5" fill="#0d1316" />
  </g>

  <text x="110" y="34" class="small">♪ NOW PLAYING</text>
  <text x="110" y="59" class="title">Cry</text>
  <text x="110" y="79" class="artist">Cigarettes After Sex</text>

  <g transform="translate(454, 80) scale(1, -1)" fill="url(#brandGrad)">
    <rect x="0" y="0" width="6" height="15" rx="3">
      <animate attributeName="height" values="8;24;12;20;8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="0" width="6" height="20" rx="3">
      <animate attributeName="height" values="24;8;20;12;24" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="0" width="6" height="12" rx="3">
      <animate attributeName="height" values="12;24;8;24;12" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="0" width="6" height="24" rx="3">
      <animate attributeName="height" values="20;8;24;12;20" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="0" width="6" height="16" rx="3">
      <animate attributeName="height" values="12;24;8;16;12" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect class="bar" x="20" y="106" width="480" height="4" rx="2"/>

  <rect fill="url(#brandGrad)" x="20" y="106" width="0" height="4" rx="2">
    <animate attributeName="width"
             values="0;480"
             dur="15s"
             repeatCount="indefinite"/>
  </rect>

  <circle cx="20" cy="108" r="5" fill="#dae6ea" filter="drop-shadow(0 0 3px rgba(85, 193, 204, 0.6))">
    <animate attributeName="cx"
             values="20;500"
             dur="15s"
             repeatCount="indefinite"/>
  </circle>

</svg>
